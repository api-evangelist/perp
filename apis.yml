aid: perp
name: Perp
description: >-
  Perp (Perpetual Protocol) is a decentralized derivatives protocol backed by
  Multicoin Capital. Its Curie (v2) generation ran on-chain perpetual futures on
  Optimism via audited smart contracts, a public GraphQL subgraph on The Graph,
  and an official TypeScript SDK (@perp/sdk-curie). The team has since pivoted to
  perp.com, a leveraged on-chain prediction-market platform ("perpetual futures
  for your predictions") offering up to 5x leverage on elections, macro, sports,
  and cultural outcomes with orderbook-driven, no-expiry positions and funding-rate
  rebalancing. The perp.com V1 Market Maker API is now documented in detail (a
  signed WebSocket + REST interface with HMAC-SHA256 auth, bulk order commands, a
  dead-man switch, private/public WebSocket streams, per-key rate limits, and a
  full MM_* error registry) though the api.perp.com host is not yet publicly
  reachable (V1 testnet). The other concrete developer surface is the Curie (v2)
  GraphQL subgraph, the TypeScript SDK, and the on-chain contract packages
  published to npm under the @perp scope.
